<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Waymark — private link workspace</title><desc id="desc">A route marker connects a short address to its destination on an ink-blue background.</desc><rect width="1200" height="400" fill="#101b2a"/><path d="M60 330H1140" stroke="#40556c"/><g font-family="system-ui, sans-serif"><text x="64" y="145" fill="#f0f5fc" font-size="76" font-weight="650" letter-spacing="-3">Waymark</text><text x="68" y="199" fill="#afc0d4" font-size="26">A private workspace for shareable links.</text><text x="68" y="287" fill="#a9d5ff" font-size="20">Create. Keep track. Point the way.</text></g><g fill="none" stroke="#a9d5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M925 78v238M925 108h123l30 33-30 33H925M962 141h71"/><path d="M650 282h105a38 38 0 0038-38v-59a38 38 0 0138-38h52M866 131l17 16-17 16"/></g><circle cx="650" cy="282" r="7" fill="#a9d5ff"/><g font-family="ui-monospace, monospace" font-size="17" fill="#afc0d4"><text x="652" y="320">/reading-guide</text><text x="926" y="212">destination</text></g></svg>
